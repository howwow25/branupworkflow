# =====================================================================
# 업무대시보드 아파치 설정 — http://toffer.co.kr/branup/branup-watcher/
#
# 붙여넣는 곳: httpd.conf 끝, 또는 conf/extra/ 에 두고 Include
#   Include conf/extra/apache-branup-watcher.conf
#
# 전제 모듈 — headers (Bitnami 기본)
# 적용 전 반드시:  httpd -t
# 적용:            아파치 다시 시작
# =====================================================================

# ── 구운 페이지를 캐시하지 못하게 한다 ─────────────────────
#
# ## 왜 (2026-11-07)
#
# 이 화면은 **정적 파일**이다. `dashboard_html.py` 가 `index.html` 을 구워
# 놓고 아파치가 그대로 내준다. 그런데 아파치는 `.html` 에 `Cache-Control` 을
# 붙이지 않고 `Last-Modified` 만 준다. 그러면 브라우저는 **되묻지 않고**
# 자기 사본을 쓴다 (휴리스틱 캐싱).
#
# 그래서 이런 일이 생긴다.
#
#   배포했다 → 사람이 포털에서 타일을 누른다 → **옛 페이지가 뜬다**
#   → 새로고침하면 새 페이지가 뜬다
#
# 화면이 깨지는 것이 아니라 **바뀐 것이 안 보이는** 모양이라, 보는 사람은
# 배포가 안 된 줄 안다. 2026-11-05 에 착수일이 안 보인다고 사흘을 찾았고,
# 2026-11-07 에 로그인한 사람 이름이 첫 화면에 안 떴다. 같은 원인이다.
#
# ## 무엇을 하는가
#
# `no-cache` 는 "쓰지 말라" 가 아니라 **"쓸 때마다 되물어라"** 다. 그래서
# 바뀐 게 없으면 아파치가 `304` 한 줄로 답하고 사본을 그대로 쓴다 — 느려지지
# 않는다. 바뀌었으면 즉시 새 것을 받는다.
#
# `must-revalidate` 를 같이 두는 이유: 중간 프록시가 `no-cache` 를 느슨하게
# 해석하는 경우를 막는다.
<Directory "C:/Bitnami/redmine-4.1.1-3/apache2/htdocs/branup/branup-watcher">
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</Directory>

# ── 소스 파일 차단 ─────────────────────────────────────────
#
# ⚠️ **이 저장소는 htdocs 안에 있다.** 포털(`C:\apps\portal`)과 다르다 —
# 구운 `index.html` 을 아파치가 직접 내주는 구조라 그렇다. 그래서 저장소의
# 파일이 주소만 알면 다운로드될 수 있는 자리다.
#
# **지금은 이미 막혀 있다** — 2026-11-07 에 확인했다(`.telethon.env`,
# `*.session` 모두 403). 서버의 httpd.conf 에 이미 규칙이 있다는 뜻이다.
# 그래도 여기 적어 두는 이유는 **규칙이 저장소와 함께 다니게** 하려는
# 것이다: 서버를 옮기거나 설정을 다시 깔 때 이 파일만 Include 하면 된다.
# 같은 규칙이 두 번 적혀도 아파치는 문제없다.
#
# 무엇을 막는가: 형제 앱에서 2026-08-07 에 `.env` 가 그대로 다운로드된 적이
# 있다. 여기에는 **텔레그램 API 자격증명이 평문으로 든 `.telethon.env` 와
# 세션 파일(`*.session`)** 이 있고, 세션 파일은 그 계정으로 로그인한 것과
# 같다. 둘 다 **git 에 커밋돼 있다** — 웹에서는 막혀 있어도 저장소를 볼 수
# 있는 사람은 누구나 가진다. 그건 이 설정으로 고칠 수 없다.
<LocationMatch "^/branup/branup-watcher/(db|files|tests|docs|__pycache__|\.git)(/|$)">
    Require all denied
</LocationMatch>
<LocationMatch "^/branup/branup-watcher/.*(\.env|\.session|\.py|\.ps1|\.sh|\.md|\.db|\.log|\.err)$">
    Require all denied
</LocationMatch>
